<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>해커스 토플 보카 단어장 & 시험지</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
        .hide-text { filter: blur(6px); user-select: none; transition: filter 0.2s; }
        .hide-text:hover { filter: none; }
    </style>
</head>
<body class="bg-white text-black min-h-screen flex flex-col border-t-4 border-black">

    <!-- Header -->
    <header class="border-b-2 border-black py-4 px-4 sm:px-8 flex flex-col sm:flex-row justify-between items-center gap-4">
        <div>
            <h1 class="text-xl sm:text-2xl font-black tracking-tight">HACKERS TOEFL VOCABULARY</h1>
            <p class="text-xs text-gray-600 font-bold">DAY 1 & DAY 2 단어장 및 모의 시험지</p>
        </div>
        <div class="flex gap-2 w-full sm:w-auto">
            <button onclick="switchTab('list')" id="btn-list" class="flex-1 sm:flex-none px-5 py-2.5 bg-black text-white font-bold rounded border border-black cursor-pointer text-sm">단어장 보기</button>
            <button onclick="switchTab('test')" id="btn-test" class="flex-1 sm:flex-none px-5 py-2.5 bg-white text-black font-bold rounded border border-black hover:bg-gray-100 transition cursor-pointer text-sm">시험 보기</button>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 max-w-4xl w-full mx-auto p-4 sm:p-6">

        <!-- 1. 단어장 탭 -->
        <section id="tab-list" class="space-y-6">
            <!-- 옵션 바 -->
            <div class="bg-gray-50 p-4 border-2 border-black rounded space-y-3">
                <div class="flex flex-col sm:flex-row gap-3">
                    <input type="text" id="search-input" placeholder="단어, 뜻, 동의어 검색..." onkeyup="filterWords()" class="px-3 py-2 border-2 border-black rounded text-sm w-full bg-white focus:outline-none">
                    <div class="flex gap-2 shrink-0">
                        <button onclick="filterDay('all')" class="day-btn px-3 py-2 bg-black text-white font-bold text-xs rounded border border-black cursor-pointer">전체</button>
                        <button onclick="filterDay(1)" class="day-btn px-3 py-2 bg-white text-black font-bold text-xs rounded border border-black cursor-pointer">Day 1</button>
                        <button onclick="filterDay(2)" class="day-btn px-3 py-2 bg-white text-black font-bold text-xs rounded border border-black cursor-pointer">Day 2</button>
                    </div>
                </div>
                <div class="flex items-center gap-4 pt-1 text-sm font-bold border-t border-gray-300">
                    <label class="flex items-center gap-1.5 cursor-pointer">
                        <input type="checkbox" id="hide-meaning" onchange="toggleMask()" class="w-4 h-4 border-2 border-black">
                        <span>한국어 뜻 가리기</span>
                    </label>
                    <label class="flex items-center gap-1.5 cursor-pointer">
                        <input type="checkbox" id="hide-synonym" onchange="toggleMask()" class="w-4 h-4 border-2 border-black">
                        <span>동의어 가리기</span>
                    </label>
                </div>
            </div>

            <!-- 단어 리스트 -->
            <div id="word-list-container" class="space-y-3">
                <!-- JS 렌더링 -->
            </div>
        </section>

        <!-- 2. 시험지 탭 -->
        <section id="tab-test" class="hidden space-y-6">
            <!-- 설정 화면 -->
            <div id="test-setup" class="border-2 border-black p-6 rounded space-y-5 bg-white">
                <h2 class="text-xl font-black border-b-2 border-black pb-2">시험 설정</h2>
                
                <div class="space-y-2">
                    <label class="block font-bold text-sm">1. 범위 선택</label>
                    <div class="flex gap-4">
                        <label class="flex items-center gap-2 cursor-pointer text-sm font-semibold">
                            <input type="radio" name="test-day" value="all" checked class="w-4 h-4"> 전체 (Day 1 + Day 2)
                        </label>
                        <label class="flex items-center gap-2 cursor-pointer text-sm font-semibold">
                            <input type="radio" name="test-day" value="1" class="w-4 h-4"> Day 1
                        </label>
                        <label class="flex items-center gap-2 cursor-pointer text-sm font-semibold">
                            <input type="radio" name="test-day" value="2" class="w-4 h-4"> Day 2
                        </label>
                    </div>
                </div>

                <div class="space-y-2">
                    <label class="block font-bold text-sm">2. 문항 수 선택</label>
                    <div class="flex gap-3">
                        <label class="flex items-center gap-1.5 cursor-pointer text-sm font-semibold">
                            <input type="radio" name="test-count" value="10" checked class="w-4 h-4"> 10문항
                        </label>
                        <label class="flex items-center gap-1.5 cursor-pointer text-sm font-semibold">
                            <input type="radio" name="test-count" value="20" class="w-4 h-4"> 20문항
                        </label>
                        <label class="flex items-center gap-1.5 cursor-pointer text-sm font-semibold">
                            <input type="radio" name="test-count" value="30" class="w-4 h-4"> 30문항
                        </label>
                        <label class="flex items-center gap-1.5 cursor-pointer text-sm font-semibold">
                            <input type="radio" name="test-count" value="all" class="w-4 h-4"> 전체 문항
                        </label>
                    </div>
                </div>

                <button onclick="generatePaper()" class="w-full py-3 bg-black text-white font-black text-base rounded hover:bg-gray-800 cursor-pointer">시험지 생성하기</button>
            </div>

            <!-- 시험지 화면 -->
            <div id="test-paper" class="hidden border-2 border-black p-4 sm:p-8 rounded space-y-8 bg-white">
                <div class="border-b-2 border-black pb-4 text-center space-y-1">
                    <h2 class="text-2xl font-black tracking-widest">VOCABULARY TEST SHEET</h2>
                    <p class="text-xs font-bold text-gray-500">각 단어의 뜻과 핵심 동의어를 알맞게 작성하세요.</p>
                </div>

                <form id="quiz-form" class="space-y-8" onsubmit="submitPaper(event)">
                    <div id="paper-questions-container" class="space-y-8">
                        <!-- JS로 문제 생성 -->
                    </div>

                    <button type="submit" class="w-full py-4 bg-black text-white font-black text-lg rounded hover:bg-gray-800 cursor-pointer shadow">
                        답안 제출 및 채점하기
                    </button>
                </form>
            </div>

            <!-- 결과 화면 -->
            <div id="test-result" class="hidden border-2 border-black p-6 rounded text-center space-y-4 bg-white">
                <h2 class="text-2xl font-black">채점 결과</h2>
                <p id="final-score" class="text-xl font-bold"></p>
                <div id="result-detail" class="text-left space-y-2 max-h-96 overflow-y-auto border p-3 border-gray-300 rounded text-sm"></div>
                <button onclick="resetTest()" class="px-6 py-2.5 bg-black text-white font-bold rounded cursor-pointer">다시 시험 보기</button>
            </div>
        </section>

    </main>

                const matchSearch = item.word.toLowerCase().includes(search) ||
                                    item.meanings.some(m => m.includes(search)) ||
                                    item.synonyms.some(s => s.toLowerCase().includes(search));
                return matchDay && matchSearch;
            });

            filtered.forEach((item, idx) => {
                const el = document.createElement('div');
                el.className = "border border-black p-4 rounded bg-white flex flex-col sm:flex-row justify-between gap-2 sm:items-center";
                
                const meaningStr = item.meanings.join(' / ');
                const synonymStr = item.synonyms.join(', ');

                el.innerHTML = `
                    <div class="space-y-1">
                        <div class="flex items-center gap-2">
                            <span class="font-black text-lg">${item.word}</span>
                            <span class="text-xs font-bold border border-black px-1.5 py-0.5 rounded">Day ${item.day}</span>
                        </div>
                        <div class="text-sm font-semibold text-gray-800 ${hideM ? 'hide-text' : ''}">
                            뜻: ${meaningStr}
                        </div>
                    </div>
                    <div class="text-xs font-bold text-gray-600 sm:text-right border-t sm:border-t-0 pt-2 sm:pt-0 ${hideS ? 'hide-text' : ''}">
                        동의어: ${synonymStr}
                    </div>
                `;
                container.appendChild(el);
            });
        }

        function filterDay(day) {
            activeDay = day;
            document.querySelectorAll('.day-btn').forEach(btn => btn.className = "day-btn px-3 py-2 bg-white text-black font-bold text-xs rounded border border-black cursor-pointer");
            event.target.className = "day-btn px-3 py-2 bg-black text-white font-bold text-xs rounded border border-black cursor-pointer";
            renderList();
        }

        function filterWords() { renderList(); }
        function toggleMask() { renderList(); }

        function switchTab(tab) {
            if(tab === 'list') {
                document.getElementById('tab-list').classList.remove('hidden');
                document.getElementById('tab-test').classList.add('hidden');
                document.getElementById('btn-list').className = "flex-1 sm:flex-none px-5 py-2.5 bg-black text-white font-bold rounded border border-black cursor-pointer text-sm";
                document.getElementById('btn-test').className = "flex-1 sm:flex-none px-5 py-2.5 bg-white text-black font-bold rounded border border-black hover:bg-gray-100 transition cursor-pointer text-sm";
            } else {
                document.getElementById('tab-list').classList.add('hidden');
                document.getElementById('tab-test').classList.remove('hidden');
                document.getElementById('btn-test').className = "flex-1 sm:flex-none px-5 py-2.5 bg-black text-white font-bold rounded border border-black cursor-pointer text-sm";
                document.getElementById('btn-list').className = "flex-1 sm:flex-none px-5 py-2.5 bg-white text-black font-bold rounded border border-black hover:bg-gray-100 transition cursor-pointer text-sm";
            }
        }

        function generatePaper() {
            const dayVal = document.querySelector('input[name="test-day"]:checked').value;
            const countVal = document.querySelector('input[name="test-count"]:checked').value;

            let pool = dayVal === 'all' ? [...vocabData] : vocabData.filter(i => i.day == dayVal);
            pool.sort(() => Math.random() - 0.5);

            let totalCount = countVal === 'all' ? pool.length : Math.min(parseInt(countVal), pool.length);
            generatedQuestions = pool.slice(0, totalCount);

            const container = document.getElementById('paper-questions-container');
            container.innerHTML = '';

            generatedQuestions.forEach((q, qIdx) => {
                const qBox = document.createElement('div');
                qBox.className = "border-2 border-black p-4 sm:p-5 rounded space-y-4 bg-gray-50";

                // 1. 단어 한국어 입력 칸 (뜻 개수만큼 분리 생성)
                let meaningInputsHTML = '';
                q.meanings.forEach((_, mIdx) => {
                    meaningInputsHTML += `
                        <input type="text" name="q_${qIdx}_m_${mIdx}" placeholder="뜻 ${q.meanings.length > 1 ? (mIdx + 1) : ''}" 
                               class="w-full sm:w-64 px-3 py-2 border-2 border-black rounded text-sm bg-white focus:outline-none">
                    `;
                });

                // 2. 동의어 3지선다 선택
                const correctSyn = q.synonyms[Math.floor(Math.random() * q.synonyms.length)];
                let otherSyns = [];
                vocabData.forEach(v => {
                    v.synonyms.forEach(s => {
                        if (!q.synonyms.includes(s) && !otherSyns.includes(s)) otherSyns.push(s);
                    });
                });
                otherSyns.sort(() => Math.random() - 0.5);
                let options = [correctSyn, otherSyns[0], otherSyns[1]].sort(() => Math.random() - 0.5);

                let synOptionsHTML = options.map((opt, oIdx) => `
                    <label class="flex items-center gap-2 border border-black p-2.5 rounded bg-white cursor-pointer text-sm font-medium">
                        <input type="radio" name="q_${qIdx}_syn" value="${opt}" class="w-4 h-4">
                        <span>${opt}</span>
                    </label>
                `).join('');

                qBox.innerHTML = `
                    <div class="flex justify-between items-center border-b border-black pb-2">
                        <span class="font-black text-lg">${qIdx + 1}. ${q.word}</span>
                        ${q.meanings.length > 1 ? `<span class="text-xs font-bold text-red-600 bg-red-50 border border-red-600 px-2 py-0.5 rounded">뜻 ${q.meanings.length}개 모두 작성</span>` : ''}
                    </div>

                    <div class="space-y-2">
                        <label class="block text-xs font-bold text-gray-700">[1] 한국어 뜻 작성</label>
                        <div class="flex flex-col sm:flex-row gap-2">
                            ${meaningInputsHTML}
                        </div>
                    </div>

                    <div class="space-y-2">
                        <label class="block text-xs font-bold text-gray-700">[2] 알맞은 동의어 선택 (3지선다)</label>
                        <div class="grid grid-cols-1 sm:grid-cols-3 gap-2">
                            ${synOptionsHTML}
                        </div>
                    </div>
                `;

                container.appendChild(qBox);
            });

            document.getElementById('test-setup').classList.add('hidden');
            document.getElementById('test-paper').classList.remove('hidden');
            document.getElementById('test-result').classList.add('hidden');
        }

        // 유연한 한국어 텍스트 정규화 (괄호 내용 제거 옵션 적용)
        function cleanText(str) {
            if (!str) return '';
            return str.replace(/\([^)]*\)/g, '') // 괄호와 안쪽 내용 제거
                      .replace(/\s+/g, '')       // 공백 제거
                      .trim().toLowerCase();
        }

        function submitPaper(e) {
            e.preventDefault();
            const formData = new FormData(e.target);

            let totalPointsPossible = 0;
            let earnedPoints = 0;
            let resultLogs = [];

            generatedQuestions.forEach((q, qIdx) => {
                // 뜻 검사 (순서 상관없이 유효한 정답 매칭)
                let remainingAnswers = q.meanings.map(m => cleanText(m));
                let correctMeaningCount = 0;

                q.meanings.forEach((_, mIdx) => {
                    totalPointsPossible += 1;
                    const userInput = cleanText(formData.get(`q_${qIdx}_m_${mIdx}`));

                    const matchIndex = remainingAnswers.findIndex(ans => ans === userInput);
                    if (userInput !== '' && matchIndex !== -1) {
                        earnedPoints += 1;
                        correctMeaningCount += 1;
                        remainingAnswers.splice(matchIndex, 1); // 사용한 정답 제외
                    }
                });

                // 동의어 검사
                totalPointsPossible += 1;
                const userSynChoice = formData.get(`q_${qIdx}_syn`);
                let synCorrect = false;
                if (userSynChoice && q.synonyms.includes(userSynChoice)) {
                    earnedPoints += 1;
                    synCorrect = true;
                }

                resultLogs.push(`
                    <div class="p-2 border-b border-gray-200">
                        <span class="font-bold">${qIdx + 1}. ${q.word}</span>: 
                        뜻 맞힌 개수 (${correctMeaningCount}/${q.meanings.length}) | 
                        동의어 (${synCorrect ? '<span class="text-green-600 font-bold">정답</span>' : '<span class="text-red-600 font-bold">오답</span>'})
                        <div class="text-xs text-gray-500">정답 뜻: ${q.meanings.join(', ')} | 동의어: ${q.synonyms.join(', ')}</div>
                    </div>
                `);
            });

            const scorePercent = ((earnedPoints / totalPointsPossible) * 100).toFixed(1);
            document.getElementById('final-score').innerText = `총 ${totalPointsPossible}점 중 ${earnedPoints}점 취득 (${scorePercent}점)`;
            document.getElementById('result-detail').innerHTML = resultLogs.join('');

            document.getElementById('test-paper').classList.add('hidden');
            document.getElementById('test-result').classList.remove('hidden');
        }

        function resetTest() {
            document.getElementById('test-setup').classList.remove('hidden');
            document.getElementById('test-paper').classList.add('hidden');
            document.getElementById('test-result').classList.add('hidden');
        }

        // 초기 실행
        renderList();
    </script>
</body>
</html>
